# TakeWeb API - Render Deployment

services:
  - type: web
    name: takeweb-api
    runtime: node
    region: oregon
    plan: free
    rootDir: packages/api
    buildCommand: pnpm install && npx prisma generate && pnpm build
    startCommand: pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # Set in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://takeweb.vercel.app
      - key: ADMIN_URL
        value: https://takeweb-admin.vercel.app
    healthCheckPath: /api/v1
